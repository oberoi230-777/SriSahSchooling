<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings & Articles — The Throne of Wisdom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --deep-purple: #1a0a2e;
            --royal-purple: #2d1b69;
            --soft-purple: #6b4c9a;
            --gold: #d4a853;
            --warm-gold: #c9952e;
            --cream: #fff8e7;
            --soft-white: #f8f4ef;
            --body-text: #4a3728;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--body-text); background: var(--cream);
            line-height: 1.7; position: relative; overflow-x: hidden;
        }
        
        /* Space background decoration for blog page */
        body::before {
            content: ''; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(107,76,154,0.03), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212,168,83,0.03), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(45,27,105,0.02), transparent 50%);
            pointer-events: none;
        }
        
        .cosmic-accent {
            position: fixed; width: 200px; height: 200px;
            border-radius: 50%; opacity: 0.03;
            pointer-events: none; z-index: -1;
        }
        .cosmic-accent:nth-of-type(1) {
            top: 10%; right: 10%;
            background: radial-gradient(circle, var(--gold), transparent);
            animation: pulseAccent 6s ease-in-out infinite;
        }
        .cosmic-accent:nth-of-type(2) {
            bottom: 20%; left: 5%;
            background: radial-gradient(circle, var(--soft-purple), transparent);
            animation: pulseAccent 8s ease-in-out infinite 2s;
        }
        
        @keyframes pulseAccent {
            0%, 100% { opacity: 0.03; transform: scale(1); }
            50% { opacity: 0.06; transform: scale(1.2); }
        }
        h1,h2,h3,h4,h5,h6 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--deep-purple); line-height: 1.3;
        }
        a { text-decoration: none; color: inherit; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--cream); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* Top Bar */
        .top-bar {
            background: var(--deep-purple); padding: 1rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .top-bar a {
            color: var(--gold); font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem; font-weight: 600;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .top-bar a:hover { opacity: 0.8; }
        .back-link {
            color: rgba(255,248,231,0.7) !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 0.9rem !important; font-weight: 400 !important;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--gold) !important;
            transform: translateX(-3px);
        }

        /* Admin Toggle */
        .admin-toggle {
            background: rgba(212,168,83,0.2); border: 1px solid rgba(212,168,83,0.3);
            color: var(--gold); padding: 0.5rem 1.2rem; border-radius: 50px;
            font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .admin-toggle:hover { background: var(--gold); color: var(--deep-purple); }
        .admin-toggle.active { background: var(--gold); color: var(--deep-purple); font-weight: 600; }

        /* Container */
        .page-container {
            max-width: 1000px; margin: 0 auto; padding: 3rem 2rem;
        }
        .page-header {
            text-align: center; margin-bottom: 3rem;
            position: relative; padding: 2rem 0;
        }
        .page-header::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(212,168,83,0.05), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .page-header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 0.5rem;
            position: relative; z-index: 1;
        }
        .page-header h1 em { color: var(--gold); font-style: italic; }
        .page-header p {
            color: rgba(74,55,40,0.7); font-size: 1.1rem;
            position: relative; z-index: 1;
        }

        /* Admin Panel */
        .admin-panel {
            display: none; background: white; border-radius: 20px;
            padding: 2.5rem; margin-bottom: 3rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 2px solid rgba(212,168,83,0.2);
        }
        .admin-panel.visible { display: block; }
        .admin-panel h2 {
            font-size: 1.5rem; margin-bottom: 1.5rem;
            color: var(--gold);
        }
        .admin-panel h2::before { content: '✦ '; }
        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: var(--deep-purple); margin-bottom: 0.5rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.8rem 1rem;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px; font-family: inherit;
            font-size: 0.95rem; background: var(--soft-white);
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,168,83,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 200px; line-height: 1.8; }
        .form-hint {
            font-size: 0.8rem; color: rgba(74,55,40,0.5);
            margin-top: 0.3rem;
        }
        .admin-actions {
            display: flex; gap: 1rem; align-items: center;
        }
        .btn-save {
            background: linear-gradient(135deg, var(--gold), var(--warm-gold));
            color: var(--deep-purple); padding: 0.8rem 2rem;
            border-radius: 10px; font-weight: 600; font-size: 0.95rem;
            border: none; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(212,168,83,0.3); }
        .btn-delete {
            background: #fff0f0; color: #c0392b;
            padding: 0.8rem 1.5rem; border-radius: 10px;
            font-weight: 500; font-size: 0.9rem;
            border: 1px solid #f5c6cb; cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-delete:hover { background: #c0392b; color: white; }

        /* Articles Grid */
        .articles-grid {
            display: grid; gap: 2rem;
        }
        .article-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }
        .article-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--soft-purple), var(--gold));
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .article-card:hover::before {
            opacity: 1;
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }
        .article-card-inner {
            padding: 2rem 2.5rem;
        }
        .article-meta {
            display: flex; align-items: center; gap: 1rem;
            margin-bottom: 1rem; flex-wrap: wrap;
        }
        .article-tag {
            padding: 0.3rem 0.8rem; border-radius: 20px;
            font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 0.05em; font-weight: 500;
        }
        .article-tag.meditation { background: rgba(212,168,83,0.15); color: #c9952e; }
        .article-tag.healing { background: rgba(107,76,154,0.15); color: var(--soft-purple); }
        .article-tag.awareness { background: rgba(90,158,143,0.15); color: #5a9e8f; }
        .article-tag.homeschooling { background: rgba(196,115,110,0.15); color: #c4736e; }
        .article-date {
            font-size: 0.8rem; color: rgba(74,55,40,0.5);
        }
        .article-card h2 {
            font-size: 1.6rem; margin-bottom: 1rem;
            font-weight: 500; line-height: 1.3;
        }
        .article-excerpt {
            font-size: 0.95rem; line-height: 1.8; color: var(--body-text);
            margin-bottom: 1.5rem;
        }
        .article-read-more {
            color: var(--soft-purple); font-weight: 500;
            font-size: 0.9rem; display: inline-flex;
            align-items: center; gap: 0.3rem;
            transition: all 0.3s ease;
        }
        .article-read-more:hover { color: var(--gold); gap: 0.6rem; }

        /* Article Expanded View */
        .article-full {
            display: none;
            padding: 0 2.5rem 2.5rem;
        }
        .article-full.visible { display: block; }
        .article-full-content {
            font-size: 1.05rem; line-height: 2; color: var(--body-text);
            white-space: pre-line;
        }
        .article-collapse {
            margin-top: 1.5rem;
            background: rgba(107,76,154,0.08);
            color: var(--soft-purple);
            padding: 0.6rem 1.5rem; border-radius: 50px;
            font-size: 0.85rem; cursor: pointer;
            border: 1px solid rgba(107,76,154,0.15);
            transition: all 0.3s ease;
        }
        .article-collapse:hover { background: var(--soft-purple); color: white; }

        /* Empty State */
        .empty-state {
            text-align: center; padding: 4rem 2rem;
        }
        .empty-state svg {
            width: 80px; height: 80px; margin-bottom: 1rem;
            opacity: 0.3;
        }
        .empty-state h3 {
            font-size: 1.5rem; margin-bottom: 0.5rem;
        }
        .empty-state p {
            color: rgba(74,55,40,0.6);
        }

        /* Notification Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: var(--deep-purple); color: var(--cream);
            padding: 1rem 2rem; border-radius: 12px;
            font-size: 0.9rem; z-index: 1000;
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s ease;
            border-left: 4px solid var(--gold);
        }
        .toast.visible { transform: translateY(0); opacity: 1; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .article-card-inner { padding: 1.5rem; }
            .top-bar { flex-direction: column; gap: 0.8rem; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- Cosmic Background Accents -->
    <div class="cosmic-accent"></div>
    <div class="cosmic-accent"></div>
    
    <!-- Top Bar -->
    <div class="top-bar">
        <a href="index.html">← Back to Home</a>
        <a href="index.html" style="font-size: 1rem;">
            ✦ The Throne of Wisdom
        </a>
        <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">
            ✎ Add New Article
        </button>
    </div>

    <div class="page-container">
        <div class="page-header">
            <h1>Writings &amp; <em>Articles</em></h1>
            <p>Insights, reflections, and wisdom on meditation, healing, and conscious living</p>
        </div>

        <!-- Admin Panel (for adding/editing articles) -->
        <div class="admin-panel" id="adminPanel">
            <h2>Add New Writing</h2>
            <form id="articleForm" onsubmit="saveArticle(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="articleTitle">Article Title *</label>
                        <input type="text" id="articleTitle" placeholder="e.g., The Art of Letting Go" required>
                    </div>
                    <div class="form-group">
                        <label for="articleCategory">Category *</label>
                        <select id="articleCategory" required>
                            <option value="">Select category</option>
                            <option value="meditation">Meditation</option>
                            <option value="healing">Healing</option>
                            <option value="awareness">Awareness</option>
                            <option value="homeschooling">Homeschooling</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="articleDate">Date</label>
                        <input type="date" id="articleDate">
                    </div>
                    <div class="form-group">
                        <label for="articleReadTime">Read Time</label>
                        <input type="text" id="articleReadTime" placeholder="e.g., 5 min read">
                    </div>
                </div>
                <div class="form-group">
                    <label for="articleExcerpt">Short Excerpt / Summary *</label>
                    <input type="text" id="articleExcerpt" placeholder="A brief summary of the article (shown on the card)" required>
                </div>
                <div class="form-group">
                    <label for="articleContent">Full Article Content *</label>
                    <textarea id="articleContent" placeholder="Paste or type your full article here...&#10;&#10;You can write freely — paragraphs will be preserved automatically." required></textarea>
                    <p class="form-hint">Paste your article content here. Paragraphs and line breaks will be preserved.</p>
                </div>
                <div class="admin-actions">
                    <button type="submit" class="btn-save">Publish Article ✦</button>
                    <button type="button" class="btn-delete" onclick="cancelEdit()">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Articles List -->
        <div class="articles-grid" id="articlesGrid">
            <!-- Articles are rendered here by JS -->
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // === Article Management ===
        const STORAGE_KEY = 'tow_articles';

        function getArticles() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || getDefaultArticles();
            } catch {
                return getDefaultArticles();
            }
        }

        function getDefaultArticles() {
            return [
                {
                    id: 'default-1',
                    title: 'The Art of Stillness: Finding Peace in a Noisy World',
                    category: 'meditation',
                    date: '2024-12-15',
                    readTime: '5 min read',
                    excerpt: 'In a world that never stops, discover how the ancient practice of stillness can transform your daily life and bring clarity to your mind.',
                    content: `In a world that never stops moving, where notifications buzz relentlessly and deadlines loom, the ancient practice of stillness offers a sanctuary. Meditation is not about emptying the mind — it is about observing it.

When you sit in stillness, you create space between stimulus and response. That space is where freedom lives. The Bhagavad Gita speaks of equanimity — the ability to remain balanced whether in joy or sorrow. This is not mere philosophy; it is a practice.

Start with just five minutes. Sit comfortably, close your eyes, and simply watch your breath. Don't try to change it. Don't judge it. Just observe. When the mind wanders — and it will — gently bring it back.

Over time, you'll notice something remarkable: the noise doesn't stop, but your relationship to it changes. You become the sky, and thoughts become clouds — passing, temporary, not defining who you are.

The Throne of Wisdom is not outside you. It has always been within.`
                },
                {
                    id: 'default-2',
                    title: 'Healing from Within: The Power of Awareness',
                    category: 'healing',
                    date: '2024-12-10',
                    readTime: '7 min read',
                    excerpt: "True healing doesn't come from fixing what's broken — it comes from becoming aware of what's already whole within you.",
                    content: `True healing doesn't come from fixing what's broken — it comes from becoming aware of what's already whole within you.

Modern psychology and ancient wisdom agree on one fundamental truth: awareness is the beginning of transformation. When you shine the light of awareness on your pain, it doesn't disappear immediately — but it begins to lose its grip on you.

Awareness-based healing is not about suppressing emotions or forcing positivity. It's about creating a compassionate space where all parts of you are welcome — the scared, the angry, the joyful, the sad.

As you practice observing your thoughts without judgment, you discover something profound: you are not your thoughts. You are the awareness behind them. This realization is liberating.

Healing is not linear. Some days you will feel on top of the world; other days, the weight may feel unbearable. Both are okay. The practice is to meet yourself with kindness in every moment.`
                },
                {
                    id: 'default-3',
                    title: 'Mindful Parenting: Raising Conscious Children',
                    category: 'awareness',
                    date: '2024-12-05',
                    readTime: '6 min read',
                    excerpt: "Parenting is not just about raising children — it's about growing alongside them. Discover how awareness transforms the parent-child relationship.",
                    content: `Parenting is perhaps the most demanding spiritual practice there is. Children have an extraordinary ability to mirror our unresolved patterns, triggering reactions we didn't know we had.

Mindful parenting begins with a simple yet radical commitment: to notice your own reactions before trying to change your child's behavior. When your child pushes your buttons — and they will — can you pause? Can you breathe? Can you respond instead of react?

This doesn't mean being perfect. It means being present. Children don't need perfect parents; they need present ones.

In the context of homeschooling, mindful parenting takes on an even deeper dimension. You are not just a parent but also a guide, a facilitator, and a co-learner. The home becomes a classroom for both of you.

Create rituals of stillness in your day. Begin the morning with a two-minute breathing exercise together. Before meals, take a moment of gratitude. These small practices plant seeds of awareness that will grow throughout your child's life.`
                }
            ];
        }

        function saveArticles(articles) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(articles));
        }

        let editingId = null;

        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            const articles = getArticles();

            if (articles.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#d4a853" stroke-width="1.5">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            <line x1="12" y1="8" x2="12" y2="14"/>
                            <line x1="9" y1="11" x2="15" y2="11"/>
                        </svg>
                        <h3>No Articles Yet</h3>
                        <p>Click "Add New Article" above to publish your first writing.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = articles.map(article => `
                <div class="article-card" id="card-${article.id}">
                    <div class="article-card-inner">
                        <div class="article-meta">
                            <span class="article-tag ${article.category}">${article.category}</span>
                            <span class="article-date">${formatDate(article.date)}${article.readTime ? ' · ' + article.readTime : ''}</span>
                        </div>
                        <h2>${escapeHtml(article.title)}</h2>
                        <p class="article-excerpt">${escapeHtml(article.excerpt)}</p>
                        <button class="article-read-more" onclick="toggleArticle('${article.id}')">
                            Read Full Article →
                        </button>
                    </div>
                    <div class="article-full" id="full-${article.id}">
                        <div class="article-full-content">${escapeHtml(article.content)}</div>
                        <button class="article-collapse" onclick="toggleArticle('${article.id}')">
                            ↑ Collapse
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleArticle(id) {
            const full = document.getElementById('full-' + id);
            const card = document.getElementById('card-' + id);
            full.classList.toggle('visible');
            if (full.classList.contains('visible')) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            const btn = document.getElementById('adminToggle');
            panel.classList.toggle('visible');
            btn.classList.toggle('active');
            if (panel.classList.contains('visible')) {
                panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function saveArticle(e) {
            e.preventDefault();
            const articles = getArticles();

            const article = {
                id: editingId || 'article-' + Date.now(),
                title: document.getElementById('articleTitle').value,
                category: document.getElementById('articleCategory').value,
                date: document.getElementById('articleDate').value || new Date().toISOString().split('T')[0],
                readTime: document.getElementById('articleReadTime').value || '5 min read',
                excerpt: document.getElementById('articleExcerpt').value,
                content: document.getElementById('articleContent').value
            };

            if (editingId) {
                const index = articles.findIndex(a => a.id === editingId);
                if (index !== -1) articles[index] = article;
                editingId = null;
            } else {
                articles.unshift(article);
            }

            saveArticles(articles);
            renderArticles();
            cancelEdit();
            showToast('Article published successfully! ✦');
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('articleForm').reset();
            document.getElementById('adminPanel').classList.remove('visible');
            document.getElementById('adminToggle').classList.remove('active');
            document.getElementById('adminPanel').querySelector('h2').textContent = 'Add New Writing';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Init
        renderArticles();
    </script>
</body>
</html>
