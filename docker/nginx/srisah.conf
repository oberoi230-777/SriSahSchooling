# ---------------------------------------------------------------------------------------
# SriSah Schooling — TLS reverse proxy sample (nginx 1.24+)
#
# Terminates HTTPS and forwards to the Node app on 127.0.0.1:3001. Replace every
# example.in value, then run:  nginx -t && systemctl reload nginx
#
# The app must be started with TRUST_PROXY=true when it sits behind this proxy so that
# Express derives the client IP and protocol from the forwarded headers.
# ---------------------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=srisah_login:10m rate=20r/m;

upstream srisah_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name school.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name school.example.in;

    # --- Certificates (Let's Encrypt / school CA) --------------------------------------
    ssl_certificate     /etc/letsencrypt/live/school.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (the app sets its own CSP as well) ---------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=srisah_login burst=10 nodelay;
        proxy_pass http://srisah_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # --- Fingerprinted build assets (safe to cache forever) ----------------------------
    location /assets/ {
        proxy_pass http://srisah_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Service worker and install manifest must never be cached ----------------------
    location = /sw.js {
        proxy_pass http://srisah_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        proxy_pass http://srisah_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # --- Portal shell ------------------------------------------------------------------
    location / {
        proxy_pass http://srisah_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
